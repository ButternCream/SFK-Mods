name: Manual Build & Release (BepInEx net481)

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Path to .csproj or .sln to build"
        required: true
        type: choice
        options:
          - DemolishAll/DemolishAll.csproj
          - SFKUILib/SFKUILib.csproj
      include_pdb:
        description: "Include PDB in zip?"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ---- Restore for PackageReference ----
      - name: Restore
        shell: pwsh
        run: |
          msbuild "${{ inputs.project }}" -t:Restore -p:RestorePackagesConfig=true
          # msbuild -t:Restore is the preferred restore path for PackageReference projects :contentReference[oaicite:3]{index=3}

      - name: Build
        shell: pwsh
        run: |
          msbuild "${{ inputs.project }}" `
            /p:Configuration="Release" `
            /p:Platform="Any CPU" `
            /m

      # ---- Resolve csproj & read Version ----
      - name: Resolve csproj & version
        id: version
        shell: pwsh
        run: |
          $target = "${{ inputs.project }}"

          if ($target.EndsWith(".csproj")) {
            $csproj = Get-Item $target
          }
          elseif ($target.EndsWith(".sln")) {
            # If you want stricter selection, point to a folder here
            $csproj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
            if (-not $csproj) { throw "No csproj found under solution." }
          }
          else {
            throw "Input must be a .csproj or .sln path."
          }

          [xml]$xml = Get-Content $csproj.FullName
          $ver = $xml.Project.PropertyGroup.Version | Select-Object -First 1
          if (-not $ver) { throw "No <Version> in $($csproj.FullName)" }

          $name = $xml.Project.PropertyGroup.AssemblyName | Select-Object -First 1
          if (-not $name) { $name = [IO.Path]::GetFileNameWithoutExtension($csproj.FullName) }

          "csproj=$($csproj.FullName)" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          "assembly_name=$name" >> $env:GITHUB_OUTPUT

      - name: Set tag name
        id: tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create git tag
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          if (git rev-parse $tag 2>$null) {
            echo "Tag $tag already exists. Skipping."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag $tag
            git push origin $tag
          }

      # ---- Package only the plugin output ----
      - name: Package plugin
        id: package
        shell: pwsh
        run: |
          $cfg = "Release"
          $csproj = "${{ steps.version.outputs.csproj }}"
          $asm = "${{ steps.version.outputs.assembly_name }}"

          $projDir = Split-Path $csproj -Parent
          $binDir  = Join-Path $projDir "bin\$cfg"

          $dll = Join-Path $binDir "$asm.dll"
          if (-not (Test-Path $dll)) { throw "Built DLL not found at $dll" }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $dll artifacts/

          if ("${{ inputs.include_pdb }}" -eq "true") {
            $pdb = Join-Path $binDir "$asm.pdb"
            if (Test-Path $pdb) { Copy-Item $pdb artifacts/ }
          }

          Compress-Archive -Path artifacts/* -DestinationPath "$asm-$cfg.zip"

          "zip=$asm-$cfg.zip" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $zip = "${{ steps.package.outputs.zip }}"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            echo "Release for $tag already exists. Skipping."
          } else {
            gh release create $tag $zip `
              --title $tag `
              --generate-notes
          }
